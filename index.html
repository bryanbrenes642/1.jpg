<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Style 🪄</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FDF8F2; --rosa: #FADADD; --fuerte: #E89999; --text: #5D4037; }
        body { font-family: 'Quicksand', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; text-align: center; }
        header { padding: 40px; background: var(--rosa); }
        h1 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--fuerte); margin: 0; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: white; border-radius: 15px; width: 280px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; }
        .price { font-size: 1.5rem; font-weight: bold; color: #D4A373; margin: 10px 0; }
        .btn { display: block; background: #25D366; color: white; padding: 10px; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Today's Style 🪄</h1>
        <p>Tu estilo, hoy</p>
    </header>
    <div class="container">
        <div class="card">
            <img src="1.jpg" alt="Arete 1">
            <div class="info">
                <div style="font-family:'Dancing Script'; font-size:1.5rem;">Gema Stud</div>
                <div class="price">¢600</div>
                <a href="https://wa.me/50689209039" class="btn">Pedir WhatsApp</a>
            </div>
        </div>
        <div class="card">
            <img src="2.jpg" alt="Arete 2">
            <div class="info">
                <div style="font-family:'Dancing Script'; font-size:1.5rem;">Van Cleef</div>
                <div class="price">¢2.200</div>
                <a href="https://wa.me/50689209039" class="btn">Pedir WhatsApp</a>
            </div>
        </div>
    </div>
</body>
</html>
